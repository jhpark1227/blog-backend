spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

batch:
  post-sync:
    cron: "0 0 * * * *"

notion:
  datasource-id: ${NOTION_DATASOURCE_ID}
  token: ${NOTION_TOKEN}