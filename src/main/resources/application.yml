spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  batch:
    job:
      enabled: false
  ai:
    google.genai:
      api-key: ${GEMINI_API_KEY}
      chat.model: gemini-3.5-flash-lite
      embedding:
        api-key: ${GEMINI_API_KEY}
        text.dimensions: 768
    vectorstore.mariadb:
      schema-validation: true
      dimensions: 768
      schema-name: blog

batch:
  post-sync.cron: "0 0 0/2 * * *"
  excerpt-refresh.cron: "0 30 4 * * *"

notion:
  datasource-id: ${NOTION_DATASOURCE_ID}
  token: ${NOTION_TOKEN}

gemini.api-key: ${GEMINI_API_KEY}

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

management:
  endpoints.web.exposure.include: health, info, prometheus, metrics, loggers
  endpoint.health.show-details: when-authorized
  metrics.distribution.percentiles-histogram.http.server.requests: true
  server.port: 9292
server.tomcat.mbeanregistry.enabled: true
