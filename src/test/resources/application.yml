spring:
  datasource:
    url: jdbc:tc:mariadb:11.8:///test
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

batch:
  post-sync.cron: "-"
  excerpt-refresh.cron: "-"

notion:
  datasource-id: test-notion-database-id
  token: test-notion-token

gemini.api-key: test-gemini-api-key