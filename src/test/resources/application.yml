spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MYSQL
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

batch:
  post-sync.cron: "0 0 * * * *"
  excerpt-refresh.cron: "0 0 0 1 1 1"

notion:
  datasource-id: test-notion-database-id
  token: test-notion-token

gemini.api-key: test-gemini-api-key